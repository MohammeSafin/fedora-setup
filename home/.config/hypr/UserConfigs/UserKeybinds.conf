# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

$mainMod = SUPER
$altMod = ALT
$files = thunar
$term = kitty
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$Spotify= $HOME/.config/hypr/UserScripts/Spotify

# rofi App launcher
#bindr = $mainMod, $mainMod_L, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window # Super Key to Launch rofi menu
bind = $mainMod, D, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window

bind = $altMod , D, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window
# ags overview
bind = $mainMod, A, exec, pkill rofi || true && ags -t 'overview'
bind = CTRL , SPACE, exec, pkill rofi || true && ags -t 'overview'

bind = $mainMod, Return, exec, $term  # Launch terminal
bind = $mainMod, T, exec, $files # Launch file manager

bind = CTRL $altMod ,T, exec, $term  # Launch terminal
bind = $altMod , M, exec, $files # Launch file manager

bind = $altMod ALT, C, exec, google-chrome # calculator (qalculate)

# pyprland
bind = $mainMod SHIFT, Return, exec, pypr toggle term # Dropdown terminal
bind = $altMod, T, exec, pypr toggle term # Dropdown terminal
bind = $mainMod, Z, exec, pypr zoom # Toggle Zoom

# applications
bind = $altMod, Z, exec, $scriptsDir/spotifymusic.sh #launch spotify
bind = $altMod, X, exec, $scriptsDir/telegram.sh #launch spotify
bind = $altMod, C, exec, $scriptsDir/vscode.sh #launch spotify

#spotify
#bind = $altMod,K , exec, $Spotify/volume-up.sh #slaw
#bind = $altMod,J , exec, $Spotify/volume-down.sh #slaw
#bind = $altMod,E , exec, $Spotify/play-pause.sh #slaw
#bind = $altMod,L , exec, $Spotify/next.sh #slaw
#bind = $altMod,H , exec, $Spotify/previous.sh #slaw

# User Added Keybinds
bind = $mainMod SHIFT, O, exec, $UserScripts/ZshChangeTheme.sh # Change oh-my-zsh theme
bindn = ALT_L, SHIFT_L, exec, $scriptsDir/SwitchKeyboardLayout.sh # Changing the keyboard layout

#lock
bind = $mainMod, L, exec, swaylock --clock --indicator --effect-blur 7x5 --effect-vignette 0.5:0.5 -i /home/ms/Pictures/wallpapers/Dynamic-Wallpapers/Dark/GeYZxYzXgAAZcvT.jpg 
bind = $mainMod, K, exec, systemctl suspend

#play and pause 
bind =  $altMod,E , exec, playerctl play-pause
bind =  $altMod,R , exec, playerctl play-pause
bind =  $altMod,L , exec, playerctl next
bind =  $altMod,H , exec, playerctl previous

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bind = SUPER, p, exec, playerctl play-pause
bind = SUPER, bracketright, exec, playerctl next
bind = SUPER, bracketleft, exec, playerctl previous

#OCR
bind =  $altMod,O , exec, ~/.local/bin/grim-ocr 


# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

# macOS-style app switcher (~/.local/bin/juhradial-switcher): Alt+Tab on the
# keyboard, or hold the MX Master gesture button (JuhRadial sends Alt+F13,
# F13 = code:191). Replaces the default Alt+Tab cyclenext.
unbind = ALT, tab
bind = ALT, tab, exec, ~/.local/bin/juhradial-switcher
bind = ALT, code:191, exec, ~/.local/bin/juhradial-switcher
# While the panel is up the switcher enters this submap so Alt+Tab and
# Alt+scroll reach the panel instead of the bindings above. The script resets
# it on exit; the bind is an emergency way out.
submap = juhradial-switcher
bind = SUPER ALT CTRL, Escape, submap, reset
submap = reset
